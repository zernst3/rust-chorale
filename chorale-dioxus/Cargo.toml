[package]
name = "chorale-dioxus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Dioxus adapter for the chorale table library. Renders `chorale-core::TableState` with virtualization, selection, and inline cell renderers."
readme = "../README.md"
keywords = ["table", "grid", "dioxus", "headless", "virtualization"]
categories = ["gui"]

[lints]
workspace = true

[features]
default = []
xlsx = ["chorale-core/xlsx"]

[dependencies]
chorale-core = { path = "../chorale-core", version = "0.2.2" }
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals", "document"] }

[dev-dependencies]
dioxus-ssr = "0.7"
# tests/group_header_keyboard.rs sends real keydown events through the
# VirtualDom. `SerializedKeyboardData` and `SerializedHtmlEventConverter` sit
# behind dioxus-html's `serialize` feature; serde_json builds the fake
# document's eval replies.
dioxus-html = { version = "0.7", features = ["serialize"] }
serde_json = "1"
